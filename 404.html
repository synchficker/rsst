<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Halaman tidak ditemukan</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:#eff6ff;color:#1e293b;text-align:center;padding:16px}
    .box{background:#fff;border-radius:16px;padding:40px;max-width:420px;box-shadow:0 10px 25px -8px rgba(37,99,235,.25)}
    h1{font-size:56px;margin:0;color:#2563eb}p{color:#64748b}
    button{background:#2563eb;color:#fff;border:0;border-radius:999px;padding:10px 24px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Halaman tidak ditemukan</h2>
    <p>Alamat yang Anda tuju tidak tersedia atau sudah dipindahkan.</p>
    <button type="button" onclick="history.length>1?history.back():location.assign(location.pathname.split('/').slice(0,2).join('/')+'/')">Kembali</button>
  </div>
</body>
</html>
